name: Deploy to Netlify

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate REST Countries API key
        env:
          VITE_RESTCOUNTRIES_API_KEY: ${{ secrets.VITE_RESTCOUNTRIES_API_KEY }}
        run: |
          response="$(curl --silent --show-error --write-out $'\n%{http_code}' \
            --header "Authorization: Bearer $VITE_RESTCOUNTRIES_API_KEY" \
            "https://api.restcountries.com/countries/v5?limit=1")"
          status="${response##*$'\n'}"
          if [ "$status" != "200" ]; then
            body="${response%$'\n'*}"
            echo "::error::REST Countries rejected VITE_RESTCOUNTRIES_API_KEY (HTTP $status): $body"
            exit 1
          fi

      - name: Build site
        run: |
          if [ -z "$VITE_RESTCOUNTRIES_API_KEY" ]; then
            echo "::error::VITE_RESTCOUNTRIES_API_KEY is unavailable to this workflow. Add it as a repository secret or attach the correct GitHub Environment."
            exit 1
          fi
          npm run build
        env:
          VITE_RESTCOUNTRIES_API_KEY: ${{ secrets.VITE_RESTCOUNTRIES_API_KEY }}

      - name: Deploy to Netlify
        run: npx --yes netlify-cli deploy --dir=dist --prod --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN"
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
